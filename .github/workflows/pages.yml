name: Publicar simulador en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Validar JavaScript del simulador
        run: |
          python - <<'PY'
          import base64, gzip, re
          from pathlib import Path
          page = gzip.decompress(base64.b64decode(Path("site-assets/index.html.gz.b64").read_text().strip())).decode("utf-8")

          # Ocultar el disparador manual de actualización en la web pública.
          # La ejecución manual permanece disponible solo desde GitHub Actions
          # para cuentas que tengan permisos de escritura en el repositorio.
          hits = list(re.finditer(r"actualiz", page, re.IGNORECASE))
          print("DIAGNÓSTICO: referencias a 'actualiz' en HTML:")
          for hit in hits:
              print(repr(page[max(0, hit.start()-260):min(len(page), hit.end()+360)]))
          print("Total de coincidencias:", len(hits))

          compare = gzip.decompress(base64.b64decode(Path("site-assets/three-options.js.gz.b64").read_text().strip())).decode("utf-8")
          preferences = Path("site-assets/preferences.js").read_text(encoding="utf-8")
          image_export = Path("site-assets/image-export.js").read_text(encoding="utf-8")
          image_css = Path("site-assets/image-export.css").read_text(encoding="utf-8")
          anchor = "$('search').addEventListener('input',renderResults);"
          if anchor not in page:
              raise SystemExit("No se encontró el punto de integración.")
          page = page.replace(anchor, compare + "\n" + preferences + "\n" + image_export + "\n" + anchor, 1)
          start = page.index("<script>") + len("<script>")
          end = page.index("</script>", start)
          Path("/tmp/simulador-completo.js").write_text(page[start:end], encoding="utf-8")
          PY
          node --check /tmp/simulador-completo.js
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar archivos del sitio
        run: |
          mkdir -p dist/data
          python - <<'PY'
          import base64, gzip, re
          from pathlib import Path

          page = gzip.decompress(base64.b64decode(Path("site-assets/index.html.gz.b64").read_text().strip())).decode("utf-8")
          css = Path("site-assets/three-options.css").read_text(encoding="utf-8")
          image_css = Path("site-assets/image-export.css").read_text(encoding="utf-8")
          markup = Path("site-assets/three-options.html").read_text(encoding="utf-8")
          js = gzip.decompress(base64.b64decode(Path("site-assets/three-options.js.gz.b64").read_text().strip())).decode("utf-8")
          preferences = Path("site-assets/preferences.js").read_text(encoding="utf-8")
          image_export = Path("site-assets/image-export.js").read_text(encoding="utf-8")

          if "</style>" not in page or '  <div class="layout">' not in page:
              raise SystemExit("No se encontraron los puntos de inserción del comparador.")
          page = page.replace("</style>", css + "\n" + image_css + "\n</style>", 1)
          page = page.replace('  <div class="layout">', markup + "\n  " + '<div class="layout">', 1)
          js_anchor = "$('search').addEventListener('input',renderResults);"
          if js_anchor not in page:
              raise SystemExit("No se encontró el punto de inserción del código JavaScript.")
          page = page.replace(js_anchor, js + "\n" + preferences + "\n" + image_export + "\n" + js_anchor, 1)

          refresh_anchor = "  restore();\n  renderAll();\n  if(showMessage)"
          if refresh_anchor not in page:
              raise SystemExit("No se encontró la recarga del catálogo para el comparador.")
          page = page.replace(refresh_anchor, "  restore();\n  restoreCompare();\n  renderAll();\n  renderCompareAll();\n  if(showMessage)", 1)

          startup_anchor = "try{COURSES=await loadCatalog();await loadMeta();restore();renderAll();}"
          if startup_anchor not in page:
              raise SystemExit("No se encontró el inicio de carga del catálogo.")
          page = page.replace(startup_anchor, "try{COURSES=await loadCatalog();await loadMeta();restore();restoreCompare();renderAll();renderCompareAll();}", 1)

          Path("dist/index.html").write_text(page, encoding="utf-8")
          Path("dist/data/courses.json.gz.b64").write_bytes(Path("data/courses.json.gz.b64").read_bytes())
          Path("dist/data/meta.json").write_bytes(Path("data/meta.json").read_bytes())
          PY
      - name: Subir archivos del sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
