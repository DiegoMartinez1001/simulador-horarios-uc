name: Actualizar horarios DAE

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths:
      - "scripts/update_catalog.py"
      - ".github/workflows/update-catalog.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dae-catalog-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.save.outputs.changed }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install requests beautifulsoup4 pymupdf
      - name: Consultar y validar horarios oficiales
        run: python scripts/update_catalog.py
      - name: Guardar catálogo si hubo cambios
        id: save
        shell: bash
        run: |
          if git diff --quiet -- data/courses.json.gz.b64 data/meta.json data/changes.json; then
            echo "No hubo cambios en los horarios."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/courses.json.gz.b64 data/meta.json data/changes.json
            git commit -m "Actualizar catálogo de horarios DAE"
            git fetch origin main
            git rebase origin/main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar última versión
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar archivos del sitio
        run: |
          mkdir -p dist/data
          python - <<'PY'
          import base64, gzip, re, subprocess, sys
          from pathlib import Path

          page = gzip.decompress(base64.b64decode(Path("site-assets/index.html.gz.b64").read_text().strip())).decode("utf-8")

          # Ocultar el disparador manual de actualización en la web pública.
          # La ejecución manual permanece disponible solo desde GitHub Actions
          # para cuentas que tengan permisos de escritura en el repositorio.
          admin_link = '<a class="pill" href="https://github.com/DiegoMartinez1001/simulador-horarios-uc/actions/workflows/update-catalog.yml" target="_blank" rel="noopener">Actualizar ahora ↗</a>'
          if page.count(admin_link) != 1:
              raise SystemExit("No se encontró exactamente el enlace administrativo esperado; se cancela la publicación.")
          page = page.replace(admin_link, "", 1)
          old_note = 'La etiqueta “Actualizar ahora” abre el proceso manual de GitHub Actions; después de que termine, usa “Recargar datos” para descargar el catálogo actualizado.'
          new_note = 'Los horarios se sincronizan automáticamente con la publicación de la DAE. Usa “Recargar datos” para volver a consultar la última versión disponible del catálogo.'
          if old_note not in page:
              raise SystemExit("No se encontró la nota informativa antigua del enlace administrativo.")
          page = page.replace(old_note, new_note, 1)
          pwa_head = '\n<link rel="manifest" href="./manifest.webmanifest">\n<meta name="theme-color" content="#173f68">\n<meta name="description" content="Consulta materias y organiza tu horario de Ingeniería UC.">\n<meta name="mobile-web-app-capable" content="yes">\n<meta name="apple-mobile-web-app-capable" content="yes">\n<meta name="apple-mobile-web-app-title" content="Horarios UC">\n<link rel="apple-touch-icon" sizes="192x192" href="./icons/app-192.png">\n'
          if 'name="viewport"' not in page and "name='viewport'" not in page:
              pwa_head = '\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n' + pwa_head
          pwa_script = '<script src="./pwa.js" defer></script>'
          if "</head>" not in page or "</body>" not in page:
              raise SystemExit("No se encontraron las etiquetas de inserción para instalar la PWA.")
          page = page.replace("</head>", pwa_head + "</head>", 1)
          page = page.replace("</body>", pwa_script + "</body>", 1)
          css = Path("site-assets/three-options.css").read_text(encoding="utf-8")
          image_css = Path("site-assets/image-export.css").read_text(encoding="utf-8")
          smart_css = Path("site-assets/smart-generator.css").read_text(encoding="utf-8")
          responsive_css = Path("site-assets/responsive.css").read_text(encoding="utf-8")
          markup = Path("site-assets/three-options.html").read_text(encoding="utf-8")
          smart_markup = Path("site-assets/smart-generator.html").read_text(encoding="utf-8")
          js = gzip.decompress(base64.b64decode(Path("site-assets/three-options.js.gz.b64").read_text().strip())).decode("utf-8")
          preferences = Path("site-assets/preferences.js").read_text(encoding="utf-8")
          image_export = Path("site-assets/image-export.js").read_text(encoding="utf-8")
          smart_generator = Path("site-assets/smart-generator.js").read_text(encoding="utf-8")
          update_notice = Path("site-assets/update-notice.js").read_text(encoding="utf-8")
          change_history = Path("site-assets/change-history.js").read_text(encoding="utf-8")
          schedule_tools = Path("site-assets/schedule-tools.js").read_text(encoding="utf-8")
          disclaimer = Path("site-assets/disclaimer.js").read_text(encoding="utf-8")
          schedule_analyzer = Path("site-assets/schedule-analyzer.js").read_text(encoding="utf-8")
          pensum_search = Path("site-assets/pensum-search.js").read_text(encoding="utf-8")
          mobile_ui = Path("site-assets/mobile-ui.js").read_text(encoding="utf-8")

          if "</style>" not in page or '  <div class="layout">' not in page:
              raise SystemExit("No se encontraron los puntos de inserción del comparador.")
          page = page.replace("</style>", css + "\n" + image_css + "\n" + smart_css + "\n" + responsive_css + "\n</style>", 1)
          page = page.replace('  <div class="layout">', smart_markup + "\n" + markup + "\n  " + '<div class="layout">', 1)
          js_anchor = "$('search').addEventListener('input',renderResults);"
          if js_anchor not in page:
              raise SystemExit("No se encontró el punto de inserción del código JavaScript.")
          page = page.replace(js_anchor, js + "\n" + preferences + "\n" + image_export + "\n" + smart_generator + "\n" + update_notice + "\n" + change_history + "\n" + schedule_tools + "\n" + disclaimer + "\n" + schedule_analyzer + "\n" + pensum_search + "\n" + mobile_ui + "\n" + js_anchor, 1)

          refresh_anchor = "  restore();\n  renderAll();\n  if(showMessage)"
          if refresh_anchor not in page:
              raise SystemExit("No se encontró la recarga del catálogo para el comparador.")
          page = page.replace(refresh_anchor, "  restore();\n  restoreCompare();\n  renderAll();\n  renderCompareAll();\n  if(showMessage)", 1)

          startup_anchor = "try{COURSES=await loadCatalog();await loadMeta();restore();renderAll();}"
          if startup_anchor not in page:
              raise SystemExit("No se encontró el inicio de carga del catálogo.")
          page = page.replace(startup_anchor, "try{COURSES=await loadCatalog();await loadMeta();restore();restoreCompare();renderAll();renderCompareAll();}", 1)

          Path("dist/index.html").write_text(page, encoding="utf-8")
          Path("dist/data/courses.json.gz.b64").write_bytes(Path("data/courses.json.gz.b64").read_bytes())
          Path("dist/data/meta.json").write_bytes(Path("data/meta.json").read_bytes())
          Path("dist/data/changes.json").write_bytes(Path("data/changes.json").read_bytes())
          Path("dist/data/pensum-index.json.gz.b64").write_bytes(Path("data/pensum-index.json.gz.b64").read_bytes())
          Path("dist/manifest.webmanifest").write_bytes(Path("site-assets/manifest.webmanifest").read_bytes())
          Path("dist/pwa.js").write_bytes(Path("site-assets/pwa.js").read_bytes())
          Path("dist/sw.js").write_bytes(Path("site-assets/sw.js").read_bytes())
          subprocess.run([sys.executable, "scripts/generate_pwa_icons.py", "dist/icons"], check=True)
          PY
      - name: Subir archivos del sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
